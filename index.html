      function addContactDialog() {
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
        const box = document.createElement('div');
        box.className = 'card'; box.style.cssText = 'width:100%;max-width:320px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;';
        box.innerHTML = `
          <h3 style="font-size:17px;font-weight:500;text-align:center;">添加联系人</h3>
          <input class="input-field" id="newContactName" placeholder="联系人名称">
          <div>
            <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">头像（可上传图片）</div>
            <div class="avatar-upload-wrap">
              <div class="avatar-preview" id="avatarPreview" style="color:var(--text);display:flex;justify-content:center;align-items:center;">${avatarSvg}</div>
              <label class="btn" style="cursor:pointer;font-size:12px;padding:8px 16px;">选择图片<input type="file" id="avatarFileInput" accept="image/*" style="display:none;"></label>
            </div>
          </div>
          <div style="display:flex;gap:10px;margin-top:6px;">
            <button class="btn" id="cancelContactBtn" style="flex:1;">取消</button>
            <button class="btn primary" id="confirmContactBtn" style="flex:1;">添加</button>
          </div>
        `;
        modal.appendChild(box); document.body.appendChild(modal);
        let currentAvatar = '';
        box.querySelector('#avatarFileInput').onchange = (e) => {
          const file = e.target.files[0]; if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => { currentAvatar = ev.target.result; box.querySelector('#avatarPreview').innerHTML = `<img src="${currentAvatar}" style="width:100%;height:100%;object-fit:cover;">`; };
          reader.readAsDataURL(file);
        };
        box.querySelector('#cancelContactBtn').onclick = () => document.body.removeChild(modal);
        box.querySelector('#confirmContactBtn').onclick = () => {
          const name = box.querySelector('#newContactName').value.trim();
          if (!name) return alert('请输入名称');
          const newId = 'c_' + Date.now();
          appData.contacts.push({ id: newId, name, avatar: currentAvatar });
          appData.messagesMap[newId] = [];
          appData.currentContactId = newId;
          saveData(); document.body.removeChild(modal); renderSettingsScreen(); updateChatTitle(); renderChatMessages();
        };
        modal.onclick = (e) => { if (e.target === modal) document.body.removeChild(modal); };
      }

      function editContact(contactId) {
        const contact = appData.contacts.find(c => c.id === contactId);
        if (!contact) return;
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
        const box = document.createElement('div');
        box.className = 'card'; box.style.cssText = 'width:100%;max-width:320px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;';
        const avatarDisplay = (contact.avatar?.startsWith('data:image') || contact.avatar?.startsWith('http')) ? `<img src="${contact.avatar}" style="width:100%;height:100%;object-fit:cover;">` : avatarSvg;
        box.innerHTML = `
          <h3 style="font-size:17px;font-weight:500;text-align:center;">编辑联系人</h3>
          <input class="input-field" id="editContactName" value="${contact.name}">
          <div>
            <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">头像（可上传图片）</div>
            <div class="avatar-upload-wrap">
              <div class="avatar-preview" id="editAvatarPreview" style="color:var(--text);display:flex;justify-content:center;align-items:center;">${avatarDisplay}</div>
              <label class="btn" style="cursor:pointer;font-size:12px;padding:8px 16px;">选择图片<input type="file" id="editAvatarFileInput" accept="image/*" style="display:none;"></label>
            </div>
          </div>
          <div style="display:flex;gap:10px;margin-top:6px;">
            <button class="btn" id="cancelEditBtn" style="flex:1;">取消</button>
            <button class="btn primary" id="confirmEditBtn" style="flex:1;">保存</button>
          </div>
        `;
        modal.appendChild(box); document.body.appendChild(modal);
        let newAvatar = contact.avatar;
        box.querySelector('#editAvatarFileInput').onchange = (e) => {
          const file = e.target.files[0]; if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => { newAvatar = ev.target.result; box.querySelector('#editAvatarPreview').innerHTML = `<img src="${newAvatar}" style="width:100%;height:100%;object-fit:cover;">`; };
          reader.readAsDataURL(file);
        };
        box.querySelector('#cancelEditBtn').onclick = () => document.body.removeChild(modal);
        box.querySelector('#confirmEditBtn').onclick = () => {
          const name = box.querySelector('#editContactName').value.trim();
          if (!name) return alert('请输入名称');
          contact.name = name; contact.avatar = newAvatar;
          saveData(); document.body.removeChild(modal); renderSettingsScreen(); updateChatTitle(); renderChatMessages();
        };
        modal.onclick = (e) => { if (e.target === modal) document.body.removeChild(modal); };
      }

      // ---------- 字卡库 ----------
      function renderCardsScreen() {
        const container = document.getElementById('cardsContent');
        container.innerHTML = '';

        // 顶部切换 Tab
        const tabRow = document.createElement('div');
        tabRow.className = 'tab-row';
        tabRow.innerHTML = `
          <div class="tab-btn ${cardTab === 'text' ? 'active' : ''}" data-tab="text">文字字卡</div>
          <div class="tab-btn ${cardTab === 'sticker' ? 'active' : ''}" data-tab="sticker">表情包</div>
        `;
        container.appendChild(tabRow);

        tabRow.querySelectorAll('.tab-btn').forEach(btn => {
          btn.onclick = () => {
            cardTab = btn.dataset.tab;
            searchKeyword = '';
            renderCardsScreen();
          };
        });

        // 搜索与去重工具栏
        const searchBox = document.createElement('div');
        searchBox.className = 'search-box';
        searchBox.innerHTML = `
          <input class="input-field" id="cardSearchInput" placeholder="搜索..." value="${searchKeyword}">
          ${cardTab === 'text' ? `<button class="btn" id="deduplicateBtn" style="white-space:nowrap;">一键去重</button>` : ''}
        `;
        container.appendChild(searchBox);

        const searchInput = document.getElementById('cardSearchInput');
        if (searchInput) {
          searchInput.oninput = (e) => {
            searchKeyword = e.target.value;
            renderCardsScreen();
            setTimeout(() => {
              const newInput = document.getElementById('cardSearchInput');
              if (newInput) {
                newInput.focus();
                newInput.setSelectionRange(newInput.value.length, newInput.value.length);
              }
            }, 0);
          };
        }

        if (cardTab === 'text') {
          const groups = appData.wordCards;

          const topActions = document.createElement('div');
          topActions.className = 'row';
          topActions.style.marginBottom = '10px';
          topActions.innerHTML = `
            <button class="btn" id="batchAddCardBtn" style="flex:1; font-size:13px;">批量添加字卡</button>
            <button class="btn" id="importCardsBtn" style="flex:1; font-size:13px; margin-left:10px;">导入字卡(.txt)</button>
          `;
          container.appendChild(topActions);

          let hasResults = false;

          for (const [groupName, cards] of Object.entries(groups)) {
            const filteredCards = searchKeyword 
              ? cards.filter(c => c.toLowerCase().includes(searchKeyword.toLowerCase())) 
              : cards;

            if (filteredCards.length === 0 && searchKeyword) continue;
            hasResults = true;

            const groupDiv = document.createElement('div');
            groupDiv.className = 'card';
            
            const titleDiv = document.createElement('div');
            titleDiv.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;';
            titleDiv.innerHTML = `
              <span style="font-weight:500;">${groupName} <span style="font-size:12px; color:var(--text-secondary);">(${filteredCards.length})</span></span>
              <div>
                <span style="cursor:pointer; font-size:12px; color:var(--text-secondary); padding:4px 8px;" id="addCard-${groupName}">+ 添加</span>
                <span style="cursor:pointer; font-size:12px; color:var(--text-secondary); padding:4px 8px;" id="delGroup-${groupName}">删除分类</span>
              </div>
            `;
            groupDiv.appendChild(titleDiv);

            titleDiv.querySelector(`#addCard-${groupName}`).onclick = () => {
              const newCard = prompt(`在「${groupName}」中添加字卡：`);
              if (newCard && newCard.trim()) {
                cards.push(newCard.trim());
                saveData(); renderCardsScreen();
              }
            };
            titleDiv.querySelector(`#delGroup-${groupName}`).onclick = () => {
              if (confirm(`确定删除分类「${groupName}」及其中所有字卡？`)) {
                delete groups[groupName];
                saveData(); renderCardsScreen();
              }
            };

            filteredCards.forEach((card) => {
              const originalIdx = cards.indexOf(card);
              const item = document.createElement('div');
              item.className = 'word-card-item';
              item.innerHTML = `<span>${card}</span><span style="cursor:pointer; color:var(--text-secondary);" data-idx="${originalIdx}">✕</span>`;
              item.querySelector('span:last-child').onclick = (e) => {
                e.stopPropagation();
                cards.splice(originalIdx, 1);
                saveData(); renderCardsScreen();
              };
              groupDiv.appendChild(item);
            });

            container.appendChild(groupDiv);
          }

          if (searchKeyword && !hasResults) {
            const empty = document.createElement('div');
            empty.className = 'empty-tip';
            empty.textContent = '没有找到匹配的字卡';
            container.appendChild(empty);
          }

          const ioDiv = document.createElement('div');
          ioDiv.className = 'row';
          ioDiv.style.marginTop = '20px';
          ioDiv.innerHTML = `<button class="btn" id="exportCardsBtn" style="width:100%;">导出全部字卡</button>`;
          container.appendChild(ioDiv);

          const deduplicateBtn = document.getElementById('deduplicateBtn');
          if (deduplicateBtn) {
            deduplicateBtn.onclick = () => {
              let removedCount = 0;
              for (const groupName in groups) {
                const cards = groups[groupName];
                const uniqueCards = [...new Set(cards)];
                removedCount += (cards.length - uniqueCards.length);
                groups[groupName] = uniqueCards;
              }
              if (removedCount > 0) {
                saveData();
                renderCardsScreen();
                alert(`去重完成，共删除了 ${removedCount} 条重复字卡。`);
              } else {
                alert('没有发现重复字卡。');
              }
            };
          }

          setTimeout(() => {
            document.getElementById('batchAddCardBtn').onclick = () => {
              const modal = document.createElement('div');
              modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
              const box = document.createElement('div');
              box.className = 'card'; box.style.cssText = 'width:100%;max-width:340px;padding:20px;display:flex;flex-direction:column;gap:12px;';
              box.innerHTML = `
                <h3 style="font-size:16px;font-weight:500;text-align:center;">批量添加字卡</h3>
                <div style="font-size:12px;color:var(--text-secondary);">选择分类：</div>
                <select id="batchGroupSelect" class="input-field" style="width:100%;">
                  ${Object.keys(groups).map(g => `<option value="${g}">${g}</option>`).join('')}
                  <option value="__new__">+ 新建分类...</option>
                </select>
                <input id="newGroupNameInput" class="input-field" placeholder="输入新分类名称" style="display:none;">
                <textarea id="batchTextarea" class="input-field" placeholder="每行一条字卡，按回车分割" style="height:100px;"></textarea>
                <div style="display:flex;gap:10px;">
                  <button class="btn" id="cancelBatchBtn" style="flex:1;">取消</button>
                  <button class="btn primary" id="confirmBatchBtn" style="flex:1;">确认添加</button>
                </div>
              `;
              modal.appendChild(box); document.body.appendChild(modal);
              
              const groupSelect = box.querySelector('#batchGroupSelect');
              const newGroupInput = box.querySelector('#newGroupNameInput');
              groupSelect.onchange = () => {
                newGroupInput.style.display = groupSelect.value === '__new__' ? 'block' : 'none';
              };

              box.querySelector('#cancelBatchBtn').onclick = () => document.body.removeChild(modal);
              box.querySelector('#confirmBatchBtn').onclick = () => {
                let targetGroup = groupSelect.value;
                if (targetGroup === '__new__') {
                  targetGroup = newGroupInput.value.trim();
                  if (!targetGroup) return alert('请输入新分类名称');
                  if (!groups[targetGroup]) groups[targetGroup] = [];
                }
                const lines = box.querySelector('#batchTextarea').value.split('\n');
                let added = 0;
                lines.forEach(line => {
                  if (line.trim()) {
                    groups[targetGroup].push(line.trim());
                    added++;
                  }
                });
                saveData(); document.body.removeChild(modal);
                if (added > 0) alert(`已添加 ${added} 条字卡到「${targetGroup}」`);
                renderCardsScreen();
              };
              modal.onclick = (e) => { if (e.target === modal) document.body.removeChild(modal); };
            };

            document.getElementById('importCardsBtn').onclick = () => {
              const input = document.createElement('input'); input.type = 'file'; input.accept = '.txt';
              input.onchange = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                  let currentGroup = '导入';
                  ev.target.result.split('\n').forEach(line => {
                    const match = line.match(/^【(.+)】$/);
                    if (match) {
                      currentGroup = match[1];
                      if (!appData.wordCards[currentGroup]) appData.wordCards[currentGroup] = [];
                    } else if (line.trim()) {
                      if (!appData.wordCards[currentGroup]) appData.wordCards[currentGroup] = [];
                      appData.wordCards[currentGroup].push(line.trim());
                    }
                  });
                  saveData(); renderCardsScreen();
                  alert('导入完成');
                };
                reader.readAsText(file);
              };
              input.click();
            };

            document.getElementById('exportCardsBtn').onclick = () => {
              let txt = '';
              for (const [g, c] of Object.entries(appData.wordCards)) {
                txt += `【${g}】\n`;
                c.forEach(x => txt += x + '\n');
              }
              const blob = new Blob([txt], { type: 'text/plain' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = '字卡库.txt';
              a.click();
            };
          }, 0);

        } else {
          // 表情包 Tab
          const groups = appData.stickerCards;

          const topActions = document.createElement('div');
          topActions.className = 'row';
          topActions.style.marginBottom = '10px';
          topActions.innerHTML = `
            <button class="btn" id="addStickerGroupBtn" style="flex:1; font-size:13px;">新建分组</button>
            <label class="btn" style="flex:1; font-size:13px; margin-left:10px; cursor:pointer;">
              上传图片
              <input type="file" id="uploadStickerInput" accept="image/*" multiple style="display:none;">
            </label>
          `;
          container.appendChild(topActions);

          let hasResults = false;

          for (const [groupName, stickers] of Object.entries(groups)) {
            const filteredStickers = searchKeyword 
              ? stickers.filter(s => groupName.toLowerCase().includes(searchKeyword.toLowerCase())) 
              : stickers;
              
            if (filteredStickers.length === 0 && searchKeyword) continue;
            hasResults = true;

            const groupDiv = document.createElement('div');
            groupDiv.className = 'card';
            
            const titleDiv = document.createElement('div');
            titleDiv.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;';
            titleDiv.innerHTML = `
              <span style="font-weight:500;">${groupName} <span style="font-size:12px; color:var(--text-secondary);">(${filteredStickers.length})</span></span>
              <div>
                <span style="cursor:pointer; font-size:12px; color:var(--text-secondary); padding:4px 8px;" id="delStickerGroup-${groupName}">删除分类</span>
              </div>
            `;
            groupDiv.appendChild(titleDiv);

            titleDiv.querySelector(`#delStickerGroup-${groupName}`).onclick = () => {
              if (confirm(`确定删除分类「${groupName}」及其中所有表情包？`)) {
                delete groups[groupName];
                saveData(); renderCardsScreen();
              }
            };

            const gridDiv = document.createElement('div');
            gridDiv.className = 'sticker-grid-card';
            
            filteredStickers.forEach((base64) => {
              const originalIdx = stickers.indexOf(base64);
              const item = document.createElement('div');
              item.className = 'sticker-card-item';
              item.innerHTML = `
                <img src="${base64}">
                <div class="delete-btn" data-idx="${originalIdx}">✕</div>
              `;
              item.querySelector('.delete-btn').onclick = (e) => {
                e.stopPropagation();
                stickers.splice(originalIdx, 1);
                saveData(); renderCardsScreen();
              };
              gridDiv.appendChild(item);
            });

            groupDiv.appendChild(gridDiv);
            container.appendChild(groupDiv);
          }

          if (searchKeyword && !hasResults) {
            const empty = document.createElement('div');
            empty.className = 'empty-tip';
            empty.textContent = '没有找到匹配的表情包';
            container.appendChild(empty);
          }

          setTimeout(() => {
            document.getElementById('addStickerGroupBtn').onclick = () => {
              const name = prompt('输入新表情包分组名称：');
              if (name && name.trim()) {
                if (!appData.stickerCards[name.trim()]) {
                  appData.stickerCards[name.trim()] = [];
                  saveData();
                  renderCardsScreen();
                } else {
                  alert('分组已存在');
                }
              }
            };

            document.getElementById('uploadStickerInput').onchange = (e) => {
              const files = e.target.files;
              if (!files || files.length === 0) return;
              
              const groupNames = Object.keys(appData.stickerCards);
              if (groupNames.length === 0) {
                appData.stickerCards['默认'] = [];
                groupNames.push('默认');
              }

              let targetGroup = prompt(`上传到哪个分组？可选：${groupNames.join(', ')}`, groupNames[0]);
              if (!targetGroup) return;
              targetGroup = targetGroup.trim();
              if (!appData.stickerCards[targetGroup]) {
                appData.stickerCards[targetGroup] = [];
              }

              let processed = 0;
              Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                  appData.stickerCards[targetGroup].push(ev.target.result);
                  processed++;
                  if (processed === files.length) {
                    saveData();
                    renderCardsScreen();
                    alert(`成功添加 ${processed} 张表情包到「${targetGroup}」`);
                  }
                };
                reader.readAsDataURL(file);
              });
            };
          }, 0);
        }
      }

      function addNewGroup() {
        if (cardTab === 'text') {
          const name = prompt('输入新分类名称：');
          if (name && name.trim()) {
            if (!appData.wordCards[name.trim()]) {
              appData.wordCards[name.trim()] = [];
              saveData();
              renderCardsScreen();
            } else {
              alert('分类已存在');
            }
          }
        } else {
          const name = prompt('输入新表情包分组名称：');
          if (name && name.trim()) {
            if (!appData.stickerCards[name.trim()]) {
              appData.stickerCards[name.trim()] = [];
              saveData();
              renderCardsScreen();
            } else {
              alert('分组已存在');
            }
          }
        }
      }

      // ---------- 初始化 ----------
      function initUI() {
        document.getElementById('themeToggleHome').onclick = () => {
          const current = appData.settings.theme;
          appData.settings.theme = current === 'light' ? 'dark' : (current === 'dark' ? 'system' : 'light');
          saveData(); applyTheme();
        };
        
        document.querySelectorAll('.app-icon').forEach(icon => {
          icon.onclick = () => {
            const app = icon.dataset.app;
            const screen = document.getElementById(app + 'Screen');
            if (screen) {
              screen.classList.add('active');
              if (app === 'chat') { updateChatTitle(); renderChatMessages(); }
              else if (app === 'cards') renderCardsScreen();
              else if (app === 'settings') renderSettingsScreen();
              else if (app === 'mailbox') renderMailboxScreen();
            }
          };
        });
        
        document.querySelectorAll('.back-btn').forEach(btn => {
          btn.onclick = () => {
            const screen = document.getElementById(btn.dataset.close + 'Screen');
            if (screen) screen.classList.remove('active');
          };
        });
        
        document.getElementById('sendBtn').onclick = onSendText;
        document.getElementById('chatInput').onkeypress = (e) => { if (e.key === 'Enter') { e.preventDefault(); onSendText(); } };
        document.getElementById('voiceBtn').onclick = startVoiceRecord;
        document.getElementById('stickerBtn').onclick = openStickerPicker;
        
        document.getElementById('addGroupBtn').onclick = addNewGroup;
        
        document.getElementById('writeLetterBtn').onclick = () => showWriteLetterDialog();

        document.getElementById('chatTitle').onclick = () => {
          document.getElementById('chatScreen').classList.remove('active');
          const settingsScreen = document.getElementById('settingsScreen');
          settingsScreen.classList.add('active');
          renderSettingsScreen();
          setTimeout(() => {
            const contactCard = document.getElementById('settingsContactList')?.closest('.card');
            if (contactCard) contactCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 100);
        };

        document.getElementById('callBtn').onclick = () => {
          startOutgoingCall();
        };

        initFloatingDrag();

        document.getElementById('floatHangupBtn').onclick = (e) => {
          e.stopPropagation();
          hangupCall();
        };

        document.getElementById('anniversaryWidget').onclick = () => {
          document.getElementById('settingsScreen').classList.add('active');
          renderSettingsScreen();
          setTimeout(() => {
            const annCard = document.querySelector('#settingsContent .card:nth-child(2)'); 
            if (annCard) annCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        };

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (appData.settings.theme === 'system') applyTheme(); });
        setInterval(updateWidgets, 30000);
        updateWidgets();
        
        startBackgroundWorker();
        startProactiveTimer();
        startIncomingCallTimer();
        startLetterTimer();
        
        updateChatTitle();
        renderChatMessages();
        applyTheme();
        
        const hour = new Date().getHours();
        document.getElementById('greetingText').textContent = hour < 12 ? '早上好' : (hour < 18 ? '下午好' : '晚上好');
      }

      window.addEventListener('load', () => {
        initUI();
        setTimeout(() => { document.getElementById('openingAnimation').style.display = 'none'; }, 2800);
      });
    })();
  </script>
</body>
</html>
